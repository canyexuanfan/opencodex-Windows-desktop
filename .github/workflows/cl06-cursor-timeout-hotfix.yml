name: CL06 cursor timeout hotfix

on:
  push:
    branches:
      - feat/cl-06-routing-profile-compatibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: feat/cl-06-routing-profile-compatibility
          fetch-depth: 0

      - name: Patch only the cursor boundary test timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/cursor-blob.test.ts')
          text = path.read_text()
          marker = '  test("key bytes stay bounded at the 4096-entry ceiling", () => {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('target cursor boundary test not found')
          end = text.find('\n  });', start)
          if end < 0:
              raise SystemExit('target cursor boundary test terminator not found')
          block = text[start:end + len('\n  });')]
          if 'timeout:' in block:
              raise SystemExit('target cursor boundary test already has an explicit timeout')
          patched = block[:-len('\n  });')] + '\n  }, { timeout: 10_000 });'
          text = text[:start] + patched + text[end + len('\n  });'):]
          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/cursor-blob.test.ts

      - name: Commit narrow fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cl06-cursor-timeout-hotfix.yml
          git add tests/cursor-blob.test.ts
          git commit -m "test(cursor): allow boundary stress test runtime"
          git push origin HEAD:feat/cl-06-routing-profile-compatibility
