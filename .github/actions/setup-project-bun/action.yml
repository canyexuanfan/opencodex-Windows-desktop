name: Setup project Bun
description: >-
  Install the Bun runtime for a job. The default `package` channel installs the
  version declared in package.json (dependencies.bun), keeping the runtime SOT in
  one place so version bumps only touch package.json and bun.lock. The
  `github-canary` channel instead downloads the oven-sh/bun rolling canary
  release and exports OPENCODEX_BUN_PATH, for Bun 1.4 qualification on preview-dev.

inputs:
  channel:
    description: "package | github-canary"
    required: false
    default: package

outputs:
  version:
    description: The resolved Bun version string (package channel).
    value: ${{ steps.resolve.outputs.version }}
  revision:
    description: The canary Bun.revision (github-canary channel only).
    value: ${{ steps.canary.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Resolve project Bun version
      id: resolve
      shell: bash
      run: |
        version="$(node -p "require('./package.json').dependencies.bun")"
        if [ -z "$version" ]; then
          echo "::error::Could not resolve Bun version from package.json"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Using Bun $version from package.json"

    # The package version is installed on BOTH channels: the canary channel still
    # needs a working Bun to run the fetch script, and keeping it also preserves
    # the 1.3.14 control binary for A/B comparison in the same job.
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.resolve.outputs.version }}

    - name: Fetch GitHub canary Bun
      id: canary
      if: ${{ inputs.channel == 'github-canary' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        json="$(bun scripts/runtime/fetch-canary-bun.ts --json)"
        echo "$json"
        path="$(node -p "JSON.parse(process.argv[1]).path" "$json")"
        revision="$(node -p "JSON.parse(process.argv[1]).revision" "$json")"
        if [ -z "$path" ] || [ -z "$revision" ]; then
          echo "::error::canary fetch returned no path/revision"
          exit 1
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
        echo "OPENCODEX_BUN_PATH=$path" >> "$GITHUB_ENV"
        echo "OCX_QUALIFIED_BUN_REVISION=$revision" >> "$GITHUB_ENV"
        echo "::notice::Qualifying against Bun $revision"
