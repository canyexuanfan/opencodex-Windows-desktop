name: Maintainer second-pass PR 1039

on:
  push:
    branches:
      - maint/1039-host-circuit

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed fixes
        run: python3 scripts/maint_1039_patch.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Focused tests
        run: bun test tests/upstream-host-circuit.test.ts tests/upstream-host-circuit-config.test.ts tests/responses-compaction-routing.test.ts
      - name: Privacy scan
        run: bun run privacy:scan
      - name: Diff check
        run: git diff --check
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Wibias"
          git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
          git add src/config.ts src/codex/upstream-host-health.ts src/server/responses/core.ts src/server/responses/compact.ts tests/upstream-host-circuit.test.ts tests/upstream-host-circuit-config.test.ts
          git commit -m "fix(codex): harden host circuit config and disable semantics"
          git push origin HEAD:maint/1039-host-circuit
