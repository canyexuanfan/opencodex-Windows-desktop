name: Maintainer PR 1243 review fixes

on:
  push:
    branches:
      - maint/1039-host-circuit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply fixes
        run: python3 scripts/maint_1243_review_fixes.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Focused tests
        run: bun test tests/upstream-host-circuit.test.ts tests/upstream-host-circuit-config.test.ts tests/responses-compaction-routing.test.ts
      - name: Privacy scan
        run: bun run privacy:scan
      - name: Diff check
        run: git diff --check
      - name: Commit fixes and remove maintenance files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Wibias"
          git config user.email "$(printf '%s%s%s' '37517432+Wibias' '@' 'users.noreply.github.com')"
          git rm scripts/maint_1243_review_fixes.py .github/workflows/maint-1243-review-fixes.yml
          git add src/codex/upstream-host-health.ts src/server/responses/core.ts tests/upstream-host-circuit.test.ts tests/responses-compaction-routing.test.ts docs-site/src/content/docs/*/reference/configuration/providers.md
          git commit -m "fix(codex): address provider-host circuit review findings"
          git push origin HEAD:maint/1039-host-circuit
