name: Maintainer PR 1243 English docs

on:
  push:
    branches:
      - maint/1039-host-circuit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix English activation contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs-site/src/content/docs/reference/configuration/providers.md')
          text = p.read_text()
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| `upstreamHostCircuitThreshold?`')]
          if len(matches) != 1:
            raise SystemExit(f'expected one circuit row, found {len(matches)}')
          i = matches[0]
          suffix = ' Applies only to Codex Pool routing with no pinned account; it is inert for `codexAccountMode: "direct"` and account-qualified selectors.'
          if suffix not in lines[i]:
            if not lines[i].endswith(' |'):
              raise SystemExit('malformed circuit row')
            lines[i] = lines[i][:-2] + suffix + ' |'
          p.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))
          PY
          git rm .github/workflows/maint-1243-english-doc.yml
      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git config user.name "Wibias"
          git config user.email "$(printf '%s%s%s' '37517432+Wibias' '@' 'users.noreply.github.com')"
          git add docs-site/src/content/docs/reference/configuration/providers.md
          git commit -m "docs: document host circuit activation scope"
          git push origin HEAD:maint/1039-host-circuit
