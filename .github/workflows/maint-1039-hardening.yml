name: Maintainer hardening PR 1039

on:
  push:
    branches:
      - maint/1039-host-circuit

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}")
              p.write_text(text.replace(old, new))

          # Share the circuit policy predicate and the bounded 503 response between
          # regular Responses and native compact instead of maintaining two variants.
          replace_exact(
              "src/server/responses/core.ts",
              '''function preAuthUpstreamHostCircuitKey(route: RouteResult, config: OcxConfig): string | null {
            if (
              normalizeUpstreamHostCircuitThreshold(config.upstreamHostCircuitThreshold) === 0
              || route.codexAccountMode !== "pool"
              || route.codexAccountId !== undefined
              || route.provider.authMode !== "forward"
              || route.provider.adapter !== "openai-responses"
            ) return null;
            return upstreamHostHealthKey(route.providerName, safeOriginLabel(route.provider.baseUrl ?? ""));
          }

          function upstreamHostCircuitOpenResponse(retryAfterSeconds: number): Response {
            return formatErrorResponse(
              503,
              "upstream_host_circuit_open",
              "Provider host is temporarily unavailable",
              { retryAfter: String(retryAfterSeconds) },
            );
          }''',
              '''export function preAuthUpstreamHostCircuitKey(
            route: Pick<RouteResult, "provider" | "providerName" | "codexAccountMode" | "codexAccountId">,
            config: OcxConfig,
            options: { requireResponsesAdapter?: boolean } = {},
          ): string | null {
            if (
              normalizeUpstreamHostCircuitThreshold(config.upstreamHostCircuitThreshold) === 0
              || route.codexAccountMode !== "pool"
              || route.codexAccountId !== undefined
              || route.provider.authMode !== "forward"
              || (options.requireResponsesAdapter !== false && route.provider.adapter !== "openai-responses")
            ) return null;
            return upstreamHostHealthKey(route.providerName, safeOriginLabel(route.provider.baseUrl ?? ""));
          }

          export function upstreamHostCircuitOpenResponse(retryAfterSeconds: number): Response {
            return formatErrorResponse(
              503,
              "upstream_host_circuit_open",
              "Provider host is temporarily unavailable",
              { retryAfter: String(retryAfterSeconds) },
            );
          }'''
          )

          replace_exact(
              "src/server/responses/compact.ts",
              'import { decodeRequestErrorResponse, handleResponses, usesCodexForwardPoolAuth } from "./core";',
              '''import {
            decodeRequestErrorResponse,
            handleResponses,
            preAuthUpstreamHostCircuitKey,
            upstreamHostCircuitOpenResponse,
            usesCodexForwardPoolAuth,
          } from "./core";'''
          )

          replace_exact(
              "src/server/responses/compact.ts",
              '''    const preAuthCompactHostKey = normalizeUpstreamHostCircuitThreshold(
                config.upstreamHostCircuitThreshold,
              ) > 0
                && route.codexAccountMode === "pool"
                && route.codexAccountId === undefined
                && route.provider.authMode === "forward"
                ? upstreamHostHealthKey(
                  route.providerName,
                  safeOriginLabel(route.provider.baseUrl ?? ""),
                )
                : null;''',
              '''    // The enclosing native-compact guard already restricts this path to
              // supported backends, so compact intentionally does not require the
              // regular Responses adapter check here.
              const preAuthCompactHostKey = preAuthUpstreamHostCircuitKey(route, config, {
                requireResponsesAdapter: false,
              });'''
          )

          p = Path("src/server/responses/compact.ts")
          text = p.read_text()
          pattern = re.compile(r'''return formatErrorResponse\(\n\s*503,\n\s*"upstream_host_circuit_open",\n\s*"Provider host is temporarily unavailable",\n\s*\{ retryAfter: String\(admission\.retryAfterSeconds\) \},\n\s*\);''')
          text, n = pattern.subn('return upstreamHostCircuitOpenResponse(admission.retryAfterSeconds);', text)
          if n != 2:
              raise SystemExit(f"compact 503 builder: expected 2 replacements, got {n}")
          p.write_text(text)

          # Make blocked-before-selection behavior observable by spying on the auth
          # resolver. The blocked second request must not add a resolver call.
          replace_exact(
              "tests/responses-compaction-routing.test.ts",
              'import { afterEach, describe, expect, test } from "bun:test";',
              'import { afterEach, describe, expect, spyOn, test } from "bun:test";'
          )
          replace_exact(
              "tests/responses-compaction-routing.test.ts",
              '''import {
            releaseCodexAuthContextProbeLease,
            resolveCodexAuthContext,
          } from "../src/codex/auth-context";''',
              '''import * as authContextModule from "../src/codex/auth-context";
          import {
            releaseCodexAuthContextProbeLease,
            resolveCodexAuthContext,
          } from "../src/codex/auth-context";'''
          )

          replace_exact(
              "tests/responses-compaction-routing.test.ts",
              '''      const first = await handleResponses(request(), config, { model: "", provider: "" });
                const second = await handleResponses(request(), config, { model: "", provider: "" });

                expect(first.status).toBe(502);
                expect(second.status).toBe(503);
                expect(second.headers.get("retry-after")).toBe("30");
                expect(sends).toBe(1);
                expect(getCodexUpstreamHealth("pool-a")).toBeNull();
                expect(getCodexUpstreamHealth("pool-b")).toBeNull();''',
              '''      const authSpy = spyOn(authContextModule, "resolveCodexAuthContext");
                try {
                  const first = await handleResponses(request(), config, { model: "", provider: "" });
                  const selectionsAfterFirst = authSpy.mock.calls.length;
                  const second = await handleResponses(request(), config, { model: "", provider: "" });

                  expect(first.status).toBe(502);
                  expect(second.status).toBe(503);
                  expect(second.headers.get("retry-after")).toBe("30");
                  expect(sends).toBe(1);
                  expect(authSpy.mock.calls.length).toBe(selectionsAfterFirst);
                  expect(getCodexUpstreamHealth("pool-a")).toBeNull();
                  expect(getCodexUpstreamHealth("pool-b")).toBeNull();
                } finally {
                  authSpy.mockRestore();
                }'''
          )

          replace_exact(
              "tests/responses-compaction-routing.test.ts",
              '''      const first = await handleResponsesCompact(
                  compactionRequest(baseCompactionBody({})),
                  config,
                  { model: "", provider: "" },
                );
                const second = await handleResponsesCompact(
                  compactionRequest(baseCompactionBody({})),
                  config,
                  { model: "", provider: "" },
                );

                expect(first.status).toBe(502);
                expect(second.status).toBe(503);
                expect(second.headers.get("retry-after")).toBe("30");
                expect(sends).toBe(1);
                expect(getCodexUpstreamHealth("pool-a")).toBeNull();
                expect(getCodexUpstreamHealth("pool-b")).toBeNull();''',
              '''      const authSpy = spyOn(authContextModule, "resolveCodexAuthContext");
                try {
                  const first = await handleResponsesCompact(
                    compactionRequest(baseCompactionBody({})),
                    config,
                    { model: "", provider: "" },
                  );
                  const selectionsAfterFirst = authSpy.mock.calls.length;
                  const second = await handleResponsesCompact(
                    compactionRequest(baseCompactionBody({})),
                    config,
                    { model: "", provider: "" },
                  );

                  expect(first.status).toBe(502);
                  expect(second.status).toBe(503);
                  expect(second.headers.get("retry-after")).toBe("30");
                  expect(sends).toBe(1);
                  expect(authSpy.mock.calls.length).toBe(selectionsAfterFirst);
                  expect(getCodexUpstreamHealth("pool-a")).toBeNull();
                  expect(getCodexUpstreamHealth("pool-b")).toBeNull();
                } finally {
                  authSpy.mockRestore();
                }'''
          )

          # Cover both mismatched-key guards so a lease for host A can never mutate B.
          replace_exact(
              "tests/upstream-host-circuit.test.ts",
              '''  test("a later physical retry without its lease cannot close a newer circuit", () => {''',
              '''  test("a lease cannot settle a different host key", () => {
              const keyA = upstreamHostHealthKey("openai", "https://chatgpt.com");
              const keyB = upstreamHostHealthKey("openai", "https://api.openai.com");
              const leaseA = admit(keyA, 1, 10_000);

              expect(resetUpstreamHostHealth(keyB, leaseA, 10_001)).toBe(false);
              recordUpstreamHostFailure(keyB, {
                code: "ECONNREFUSED",
                now: 10_002,
                threshold: 1,
                lease: leaseA,
              });
              expect(getUpstreamHostHealth(keyB)).toBeNull();

              recordUpstreamHostFailure(keyA, {
                code: "ECONNREFUSED",
                now: 10_003,
                threshold: 1,
                lease: leaseA,
              });
              expect(getUpstreamHostHealth(keyA)).toMatchObject({
                consecutiveFailures: 1,
                cooldownUntil: 10_003 + UPSTREAM_HOST_CIRCUIT_COOLDOWN_MS,
              });
            });

            test("a later physical retry without its lease cannot close a newer circuit", () => {'''
          )

          # Clarify account-vs-provider cooldowns in every shipped locale.
          replacements = {
              "docs-site/src/content/docs/reference/configuration/providers.md": ("account health, cooldowns, thread/session affinity", "account health, account cooldowns, thread/session affinity"),
              "docs-site/src/content/docs/ja/reference/configuration/providers.md": ("アカウントの健全性、クールダウン", "アカウントの健全性、アカウントのクールダウン"),
              "docs-site/src/content/docs/ko/reference/configuration/providers.md": ("계정 상태, 쿨다운", "계정 상태, 계정 쿨다운"),
              "docs-site/src/content/docs/ru/reference/configuration/providers.md": ("здоровье аккаунта, кулдауны,", "здоровье аккаунта, кулдауны аккаунта,"),
              "docs-site/src/content/docs/zh-cn/reference/configuration/providers.md": ("账户健康、冷却、线程/会话亲和性", "账户健康、账户冷却、线程/会话亲和性"),
          }
          for path, (old, new) in replacements.items():
              replace_exact(path, old, new)
          PY

      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Focused circuit tests
        run: bun test tests/upstream-host-circuit.test.ts tests/responses-compaction-routing.test.ts
      - name: Privacy scan
        run: bun run privacy:scan
      - name: Diff check
        run: git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Wibias"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add src/server/responses/core.ts src/server/responses/compact.ts tests/upstream-host-circuit.test.ts tests/responses-compaction-routing.test.ts docs-site/src/content/docs/*/reference/configuration/providers.md
          git commit -m "fix(codex): harden provider-host circuit port"
          git push origin HEAD:maint/1039-host-circuit
