name: Maintainer vision reasoning fix

on:
  push:
    branches:
      - agent/maintainer-vision-reasoning

permissions:
  contents: write

concurrency:
  group: maintainer-vision-reasoning-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/maintainer-vision-reasoning
          fetch-depth: 0

      - name: Apply maintainer review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gui/src/pages/dashboard-shared.ts')
          s = p.read_text()
          old = '''/** Preserve a supported value; otherwise clamp to the highest rung the selected model advertises. */
          export function clampVisionReasoningToLadder(
            ladder: VisionReasoning[],
            persisted: VisionReasoning,
          ): VisionReasoning {
            return ladder.includes(persisted) ? persisted : ladder[ladder.length - 1];
          }
          '''
          new = '''/** Match the server rule: keep a supported value, otherwise clamp downward by rank. */
          export function clampVisionReasoningToLadder(
            ladder: VisionReasoning[],
            persisted: VisionReasoning,
          ): VisionReasoning {
            if (ladder.length === 0 || ladder.includes(persisted)) return persisted;
            const requestedRank = VISION_REASONING_LEVELS.indexOf(persisted);
            let best = ladder[0];
            let bestRank = VISION_REASONING_LEVELS.indexOf(best);
            for (const effort of ladder) {
              const rank = VISION_REASONING_LEVELS.indexOf(effort);
              if (rank <= requestedRank && rank >= bestRank) {
                best = effort;
                bestRank = rank;
              }
            }
            return best;
          }
          '''
          if old not in s:
              raise SystemExit('dashboard clamp block not found')
          p.write_text(s.replace(old, new))

          p = Path('gui/tests/vision-reasoning-contract.test.ts')
          s = p.read_text()
          marker = '''test("unknown vision model metadata stays permissive", () => {
            expect(visionReasoningLadder([], "custom/vision-model")).toEqual(VISION_REASONING_LEVELS);
          });
          '''
          addition = marker + '''
          test("vision reasoning clamp matches server semantics for non-prefix ladders", () => {
            const models: ModelInfo[] = [
              { id: "gapped", provider: "openai", namespaced: "gapped", reasoningEfforts: ["low", "high"] },
              { id: "high-floor", provider: "openai", namespaced: "high-floor", reasoningEfforts: ["high", "max"] },
            ];
            expect(clampVisionReasoningToLadder(visionReasoningLadder(models, "gapped"), "medium")).toBe("low");
            expect(clampVisionReasoningToLadder(visionReasoningLadder(models, "high-floor"), "low")).toBe("high");
          });
          '''
          if marker not in s:
              raise SystemExit('gui test marker not found')
          p.write_text(s.replace(marker, addition))

          p = Path('src/server/management/model-rows.ts')
          s = p.read_text()
          import_marker = 'import { providerContextCap } from "../../providers/context-cap";\n'
          if 'isVisionReasoningEffort' not in s:
              s = s.replace(import_marker, import_marker + 'import { isVisionReasoningEffort } from "../../reasoning-effort";\n')
          old_row = 'reasoningEfforts: nativeReasoningEfforts(row.slug),'
          if old_row not in s:
              raise SystemExit('native reasoning row not found')
          p.write_text(s.replace(old_row, 'reasoningEfforts: nativeReasoningEfforts(row.slug).filter(isVisionReasoningEffort),'))

          p = Path('tests/vision-reasoning-contract.test.ts')
          s = p.read_text()
          old_rows = '''    const luna = rows.find(row => row.native === true && row.id === "gpt-5.6-luna") as
              | { reasoningEfforts?: string[] }
              | undefined;

            expect(mini?.reasoningEfforts).toEqual(["low", "medium", "high", "xhigh"]);
            expect(luna?.reasoningEfforts).toEqual(["low", "medium", "high", "xhigh", "max"]);'''
          new_rows = '''    const luna = rows.find(row => row.native === true && row.id === "gpt-5.6-luna") as
              | { reasoningEfforts?: string[] }
              | undefined;
            const sol = rows.find(row => row.native === true && row.id === "gpt-5.6-sol") as
              | { reasoningEfforts?: string[] }
              | undefined;

            expect(mini?.reasoningEfforts).toEqual(["low", "medium", "high", "xhigh"]);
            expect(luna?.reasoningEfforts).toEqual(["low", "medium", "high", "xhigh", "max"]);
            expect(sol?.reasoningEfforts).not.toContain("ultra");'''
          if old_rows not in s:
              raise SystemExit('backend row assertions not found')
          s = s.replace(old_rows, new_rows)
          header = 'headers: { "content-type": "application/json" },'
          if header not in s:
              raise SystemExit('management request headers not found')
          s = s.replace(header, 'headers: { "content-type": "application/json", host: "localhost" },', 1)
          p.write_text(s)

          p = Path('gui/src/pages/dashboard-overview-sections.tsx')
          s = p.read_text()
          anchor = 'value={visionReasoning}'
          start = s.index(anchor)
          old_label = 'label={t("dash.searchReasoning")}'
          label_at = s.index(old_label, start)
          p.write_text(s[:label_at] + 'label={t("dash.visionReasoning")}' + s[label_at + len(old_label):])

          translations = {
              'gui/src/i18n/en.ts': 'Vision reasoning effort',
              'gui/src/i18n/de.ts': 'Vision-Reasoning-Aufwand',
              'gui/src/i18n/ja.ts': 'ビジョン推論負荷',
              'gui/src/i18n/ko.ts': '비전 추론 강도',
              'gui/src/i18n/ru.ts': 'Уровень рассуждений для изображений',
              'gui/src/i18n/zh.ts': '视觉推理强度',
          }
          for path, text in translations.items():
              p = Path(path)
              s = p.read_text()
              if '"dash.visionReasoning"' in s:
                  continue
              lines = s.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if '"dash.searchReasoning"' in line:
                      indent = line[:len(line)-len(line.lstrip())]
                      lines.insert(i + 1, f'{indent}"dash.visionReasoning": "{text}",\n')
                      break
              else:
                  raise SystemExit(f'searchReasoning key not found in {path}')
              p.write_text(''.join(lines))

          p = Path('docs-site/src/content/docs/zh-cn/guides/vision-sidecar-reasoning.md')
          p.write_text(p.read_text().replace('opencodex', 'OpenCodex'))

          Path('.github/workflows/maintainer-vision-reasoning-fix.yml').unlink()
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Focused verification
        run: |
          bun test tests/vision-reasoning-contract.test.ts
          cd gui
          bun test tests/vision-reasoning-contract.test.ts
          cd ..
          bun run typecheck
          cd gui
          bun run lint

      - name: Commit and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenCodex Maintainer"
          git config user.email "37517432+Wibias@users.noreply.github.com"
          git add -A
          git commit -m "fix(vision): align capability clamps and review contracts"
          git push origin HEAD:agent/maintainer-vision-reasoning
