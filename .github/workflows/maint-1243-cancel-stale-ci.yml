name: Clear stale PR 1243 CI

on:
  push:
    branches:
      - maint/1039-host-circuit

permissions:
  actions: write
  contents: write

jobs:
  clear:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel stale Cross-platform run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31220090908/cancel"
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Wibias"
          git config user.email "$(printf '%s%s%s' '37517432+Wibias' '@' 'users.noreply.github.com')"
          git rm .github/workflows/maint-1243-cancel-stale-ci.yml
          git commit -m "chore: remove stale-ci cleanup workflow"
          git push origin HEAD:maint/1039-host-circuit
