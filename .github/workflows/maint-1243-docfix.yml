name: Maintainer PR 1243 doc carry-forward

on:
  push:
    branches:
      - maint/1039-host-circuit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply carried review wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs-site/src/content/docs/reference/configuration/providers.md')
          text = path.read_text()
          old = 'account health, cooldowns, thread/session affinity'
          new = 'account health, account cooldowns, thread/session affinity'
          if text.count(old) != 1:
            raise SystemExit(f'expected one English cooldown phrase, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/maint-1243-docfix.yml
      - name: Commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Wibias"
          git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
          git add docs-site/src/content/docs/reference/configuration/providers.md
          git commit -m "docs: distinguish account and host cooldowns"
          git push origin HEAD:maint/1039-host-circuit
