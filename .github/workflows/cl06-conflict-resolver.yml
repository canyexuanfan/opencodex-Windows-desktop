name: CL-06 conflict resolver

on:
  push:
    branches: [feat/cl-06-routing-profile-compatibility]
    paths:
      - ".github/workflows/cl06-conflict-resolver.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CL-06 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: feat/cl-06-routing-profile-compatibility
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Merge dev and resolve additive conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev

          set +e
          git merge --no-ff --no-commit origin/dev
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicts to resolve:\n%s\n' "$conflicts"

            allowed='gui/src/i18n/de.ts
gui/src/i18n/en.ts
gui/src/i18n/ja.ts
gui/src/i18n/ko.ts
gui/src/i18n/ru.ts
gui/src/i18n/tr.ts
gui/src/i18n/zh.ts
gui/src/pages/RoutingProfiles.tsx
gui/src/routing-profile-editor-data.ts
src/routing/evaluator.ts
src/routing/profile.ts
src/routing/trace.ts
src/types.ts'

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if ! printf '%s\n' "$allowed" | grep -Fxq "$path"; then
                echo "::error::Unexpected merge conflict: $path"
                exit 1
              fi
              safe="$(printf '%s' "$path" | tr '/.' '__')"
              git show ":1:$path" > "/tmp/${safe}.base"
              git show ":2:$path" > "/tmp/${safe}.ours"
              git show ":3:$path" > "/tmp/${safe}.theirs"
              git merge-file --union "/tmp/${safe}.ours" "/tmp/${safe}.base" "/tmp/${safe}.theirs"
              cp "/tmp/${safe}.ours" "$path"
              git add "$path"
            done <<< "$conflicts"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo '::error::Unresolved merge conflicts remain'
            git status --short
            exit 1
          fi

      - name: Isolate compatibility penalty regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/routing-compatibility.test.ts')
          s = p.read_text()
          marker = 'test("compatibility penalty lowers score instead of rewarding unknown evidence", () => {'
          start = s.index(marker)
          end = s.find('\ntest(', start + len(marker))
          if end < 0:
              end = len(s)
          block = s[start:end]
          anchor = '''      compat: {
                candidates: [{ provider: "a", model: "m1" }],
                compatibility: {'''
          if anchor not in block:
              anchor = '''      compat: {
            candidates: [{ provider: "a", model: "m1" }],
            compatibility: {'''
          if anchor not in block:
              raise SystemExit('compatibility penalty test anchor not found')
          replacement = anchor.replace('                compatibility: {', '                optimize: { latency: 1, health: 0, cost: 0, quota: 0 },\n                compatibility: {').replace('            compatibility: {', '            optimize: { latency: 1, health: 0, cost: 0, quota: 0 },\n            compatibility: {')
          block = block.replace(anchor, replacement, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          git add tests/routing-compatibility.test.ts

      - name: Remove resolver from final tree
        run: |
          git rm .github/workflows/cl06-conflict-resolver.yml

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Build and validate merged routing contracts
        run: |
          bun run typecheck
          bun test --isolate \
            tests/routing-compatibility.test.ts \
            tests/routing-compatibility-auth-identity.test.ts \
            tests/routing-compatibility-boundaries.test.ts \
            tests/routing-profile-editor-data.test.ts \
            tests/routing-profile-management-editor.test.ts \
            tests/cost-cap-unknown-evidence.test.ts
          cd gui
          bun run build
          bun test --isolate tests/routing-profiles.test.tsx

      - name: Commit resolved merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m "merge(dev): resolve CL-06 routing conflicts"
          git push origin HEAD:feat/cl-06-routing-profile-compatibility
