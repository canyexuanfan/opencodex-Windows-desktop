name: Enforce PR target branch

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - synchronize

# pull-requests:write covers title/comment updates.
# contents:write is required for convertPullRequestToDraft /
# markPullRequestReadyForReview GraphQL mutations with GITHUB_TOKEN
# (otherwise: "Resource not accessible by integration"). This workflow
# never checks out PR head code.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: enforce-pr-target-${{ github.event.pull_request.number }}

jobs:
  enforce-target:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted PR-quality scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The event's base commit, not the repository default: pull_request_target
          # runs this workflow from the base revision, and the scripts must come
          # from the same revision or a merged gate would run against the
          # pre-promotion scripts on `main`. The immutable SHA pins the checkout
          # to the exact base commit the event was built against.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            MAINTAINERS.md

      - name: Enforce PR target, ancestry, and description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const path = require("path");
            const fs = require("node:fs");
            const {
              collectPrQualityFailures,
              authorHasPushPermission,
              extractReviewReadiness,
              appendReviewReadinessSection,
              stripReviewReadinessSection,
              uncheckReviewReadinessBoxes,
              REVIEW_READINESS_CLAIM_INDEX,
              resetReviewReadinessSection
            } = require(
              path.join(process.cwd(), ".github", "scripts", "pr-quality.cjs"),
            );
            const {
              parseState,
              stateMarker,
              parseReadinessState,
              clearedEnforcerState,
              defaultEnforcerState,
              defaultReadinessState,
              completionIsStale,
              readinessClaimViolations,
              READINESS_STATE_VERSION
            } = require(
              path.join(
                process.cwd(),
                ".github",
                "scripts",
                "pr-quality-state.cjs"
              ),
            );
            const {
              READINESS_MARKER,
              inlineCode,
              buildReadinessCommentBody,
              buildFailureSections,
              failureSummary,
              buildStaleNotice,
              buildClaimCheckNotice
            } = require(
              path.join(
                process.cwd(),
                ".github",
                "scripts",
                "pr-quality-messages.cjs"
              ),
            );
            const {
              parseMaintainerLogins
            } = require(
              path.join(
                process.cwd(),
                ".github",
                "scripts",
                "pr-maintainers.cjs"
              ),
            );

            const ALLOWED_BASES = ["dev"];
            const DEFAULT_BASE = "dev";
            const TITLE_PREFIX = "[WRONG BRANCH] ";
            const COMMENT_MARKER = "<!-- pr-quality-enforcer -->";
            const LEGACY_COMMENT_MARKER = "<!-- wrong-branch-enforcer -->";
            const MAINTAINERS_FILE = "MAINTAINERS.md";

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100
              }
            );

            const botComment = comments.find(
              comment =>
                comment.user?.login === "github-actions[bot]" &&
                (comment.body?.includes(COMMENT_MARKER) ||
                  comment.body?.includes(LEGACY_COMMENT_MARKER))
            );
            let botCommentId = botComment?.id ?? null;

            const readinessComment = comments.find(
              comment =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(READINESS_MARKER)
            );
            let readinessCommentId = readinessComment?.id ?? null;
            const storedReadinessState = parseReadinessState(
              readinessComment?.body,
              message => core.warning(message)
            );

            /**
             * Maintainers from `MAINTAINERS.md` on the trusted default branch
             * (checked out sparse by the step above). The file is the canonical
             * list; mentioning these logins on the PR notifies them.
             */
            function readMaintainerLogins() {
              try {
                const text = fs.readFileSync(
                  path.join(process.cwd(), MAINTAINERS_FILE),
                  "utf8"
                );
                return parseMaintainerLogins(text);
              } catch (error) {
                core.warning(
                  `Could not read ${MAINTAINERS_FILE}: ${error.message}`
                );

                return [];
              }
            }

            async function upsertReadinessComment(state, readiness, extra) {
              const lines = buildReadinessCommentBody(state, readiness, extra);

              if (readinessCommentId) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: readinessCommentId,
                  body: lines.join("\n")
                });

                return;
              }

              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: lines.join("\n")
              });
              readinessCommentId = created.data.id;
            }

            async function upsertComment(body) {
              if (botCommentId) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: botCommentId,
                  body
                });

                return;
              }

              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
              botCommentId = created.data.id;
            }

            async function convertToDraft() {
              await github.graphql(
                `
                  mutation($pullRequestId: ID!) {
                    convertPullRequestToDraft(
                      input: {
                        pullRequestId: $pullRequestId
                      }
                    ) {
                      pullRequest {
                        id
                        isDraft
                      }
                    }
                  }
                `,
                {
                  pullRequestId: pr.node_id
                }
              );
            }

            async function markReadyForReview() {
              await github.graphql(
                `
                  mutation($pullRequestId: ID!) {
                    markPullRequestReadyForReview(
                      input: {
                        pullRequestId: $pullRequestId
                      }
                    ) {
                      pullRequest {
                        id
                        isDraft
                      }
                    }
                  }
                `,
                {
                  pullRequestId: pr.node_id
                }
              );
            }

            const storedState = parseState(
              botComment?.body,
              message => core.warning(message)
            );

            let authorPermission = null;
            let permissionLookupFailed = false;
            try {
              const { data: permissionData } =
                await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: pr.user.login
                });
              authorPermission = permissionData.permission;
            } catch (error) {
              permissionLookupFailed = true;
              core.warning(
                `Could not look up collaborator permission: ${error.message}`
              );
            }

            let behindMain = 0;
            let behindBase = 0;
            let aheadMain = 0;
            let ancestryLookupFailed = false;
            const baseAllowed = ALLOWED_BASES.includes(pr.base.ref);

            // Stacked PR exception: base is another open PR's head branch (same
            // head repo as this PR's base repo). Closed/missing parent stays wrong_base.
            let stackedBase = false;
            if (!baseAllowed) {
              try {
                const openPrs = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "open",
                  per_page: 100
                });
                const baseOwner =
                  pr.base.repo?.owner?.login ?? owner;
                const baseName = pr.base.repo?.name ?? repo;
                stackedBase = openPrs.some(
                  other =>
                    other.number !== pull_number &&
                    other.head?.ref === pr.base.ref &&
                    (other.base?.repo?.owner?.login ?? owner) === baseOwner &&
                    (other.base?.repo?.name ?? repo) === baseName
                );
                if (stackedBase) {
                  core.info(
                    `Base ${pr.base.ref} matches an open PR head; treating as stacked (skip wrong_base).`
                  );
                }
              } catch (error) {
                core.warning(
                  `Could not list open PRs for stacked-base check: ${error.message}`
                );
              }
            }

            if (baseAllowed) {
              const headSha = pr.head.sha;
              try {
                const { data: mainCompare } =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `main...${headSha}`
                  });
                behindMain = mainCompare.behind_by;
                aheadMain = mainCompare.ahead_by;

                const { data: baseCompare } =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${pr.base.ref}...${headSha}`
                  });
                behindBase = baseCompare.behind_by;
              } catch (error) {
                ancestryLookupFailed = true;
                core.warning(
                  `Could not compare commits for ancestry check: ${error.message}`
                );
              }
            }

            const failures = collectPrQualityFailures({
              baseRef: pr.base.ref,
              allowedBases: ALLOWED_BASES,
              title: pr.title,
              body: pr.body,
              behindMain,
              behindBase,
              aheadMain,
              authorPermission,
              permissionLookupFailed,
              ancestryLookupFailed,
              stackedBase
            });

            // The readiness gate applies to contributors (no push permission).
            // Maintainers keep the failure-only contract: draft while quality
            // gates fail, ready again once they clear. A failed permission
            // lookup fails closed — the PR is treated as a contributor PR.
            const authorIsMaintainer =
              !permissionLookupFailed && authorHasPushPermission(authorPermission);
            const checklistRequired = !authorIsMaintainer;

            // A confirmed maintainer does not need the bot's checklist: retire
            // the injected section from the body so it stops rendering as a
            // gate on later runs.
            let readiness = extractReviewReadiness(pr.body);
            if (!checklistRequired && readiness.present) {
              const strippedBody = stripReviewReadinessSection(pr.body ?? "");
              if (strippedBody !== pr.body) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number,
                  body: strippedBody
                });
              }
              readiness = extractReviewReadiness(strippedBody);
            }

            // The tickable checklist lives in the PR body, because only the PR
            // author can edit it. Inject it once; the HTML markers make the
            // injection idempotent, so the `edited` event this write triggers
            // cannot churn the body on every run.
            if (checklistRequired && !readiness.present) {
              const injectedBody = appendReviewReadinessSection(pr.body ?? "");
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                body: injectedBody
              });
              readiness = extractReviewReadiness(injectedBody);
            }
            let checklistComplete = readiness.present && readiness.complete;

            // A completed checklist is an attestation about a specific head
            // (see `completionIsStale`). When it is stale the gate resets the
            // boxes and the notification state, re-drafts, and tells the
            // author to re-test and re-tick against the latest code.
            const eventHeadSha =
              context.payload.pull_request?.head?.sha ?? pr.head.sha;
            const completionHeadSha =
              storedReadinessState?.completedAtHeadSha ?? null;
            const headDrifted = completionIsStale({
              checklistRequired,
              checklistComplete,
              readinessPresent: readiness.present,
              completionHeadSha,
              eventHeadSha,
              liveHeadSha: pr.head.sha,
              eventAction: context.payload.action
            });

            let readinessStateOverride = null;
            let headDriftNotice = [];
            let revalidationNotice = [];
            if (headDrifted) {
              // Re-fetch the PR so an author edit that landed while this job
              // was reading cannot be clobbered by the reset.
              const { data: freshPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number
              });
              const freshReadiness = extractReviewReadiness(
                freshPr.body ?? ""
              );
              readinessStateOverride = defaultReadinessState();
              headDriftNotice = buildStaleNotice({
                completionHeadSha,
                liveHeadSha: freshPr.head.sha,
                eventAction: context.payload.action
              });
              if (freshReadiness.present && freshReadiness.complete) {
                const resetBody = resetReviewReadinessSection(
                  freshPr.body ?? ""
                );
                if (resetBody !== freshPr.body) {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number,
                    body: resetBody
                  });
                }
                readiness = extractReviewReadiness(resetBody);
              } else {
                readiness = freshReadiness;
              }
              checklistComplete = readiness.present && readiness.complete;
            }

            // The bot verifies the two checklist claims it can check itself.
            // The CI box only counts when the head's `ci` check (the repo's
            // documented "CI passed" signal) is green; the latest-dev box only
            // counts while the head is at most READINESS_LATEST_DEV_BEHIND_MAX
            // commits behind the base. A disproved claim unchecks that box and
            // keeps the PR a draft, exactly like a head-drift reset.
            let claimViolations = [];
            let claimNotice = [];
            if (
              checklistRequired &&
              checklistComplete &&
              !headDrifted &&
              failures.length === 0
            ) {
              let ciGreen = true;
              try {
                const { data: checksData } =
                  await github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: pr.head.sha,
                    per_page: 100
                  });
                const ciCheck = (checksData.check_runs ?? []).find(
                  check => check.name === "ci"
                );
                // No `ci` check means no CI run exists for this head (for
                // example a docs-only change): there is nothing to contradict
                // the author's claim. A real `ci` check must be completed
                // successfully.
                ciGreen =
                  ciCheck === undefined ||
                  (ciCheck.status === "completed" &&
                    ciCheck.conclusion === "success");
              } catch (error) {
                core.warning(
                  `Could not list checks for the readiness claim check: ${error.message}`
                );
                ciGreen = false;
              }
              claimViolations = readinessClaimViolations({
                ciGreen,
                behindBase,
                behindUnknown: ancestryLookupFailed
              });
              if (claimViolations.length > 0) {
                const { data: freshPr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number
                });
                const freshReadiness = extractReviewReadiness(
                  freshPr.body ?? ""
                );
                readinessStateOverride = defaultReadinessState();
                claimNotice = buildClaimCheckNotice(
                  claimViolations,
                  freshPr.head.sha
                );
                if (freshReadiness.present) {
                  const uncheckedBody = uncheckReviewReadinessBoxes(
                    freshPr.body ?? "",
                    claimViolations.map(
                      code => REVIEW_READINESS_CLAIM_INDEX[code]
                    )
                  );
                  if (uncheckedBody !== freshPr.body) {
                    await github.rest.pulls.update({
                      owner,
                      repo,
                      pull_number,
                      body: uncheckedBody
                    });
                  }
                  readiness = extractReviewReadiness(uncheckedBody);
                } else {
                  readiness = freshReadiness;
                }
                checklistComplete = readiness.present && readiness.complete;
              }
            }

            // A contributor PR stays a draft while the checklist is open, even
            // when every quality gate already passes.
            const mustDraft =
              failures.length > 0 || (checklistRequired && !checklistComplete);

            // Which reset notice (head drift vs claim check) accompanies the
            // draft path; only one can be active because the claim check is
            // skipped when the head drifted.
            revalidationNotice = headDrifted
              ? headDriftNotice
              : claimNotice;

            if (mustDraft) {
              let draftConverted = false;
              const readinessState =
                readinessStateOverride ??
                (storedReadinessState
                  ? { ...storedReadinessState }
                  : defaultReadinessState());
              if (checklistRequired && checklistComplete) {
                // The attestation covers this head even while another quality
                // gate keeps the draft: bind it now, because the failure path
                // below returns before the completion block that records it.
                // A later push then still resets the checklist instead of
                // sliding the completion forward onto un-attested code.
                readinessState.completedAtHeadSha = pr.head.sha;
                readinessState.version = READINESS_STATE_VERSION;
              }
              const state = storedState?.active
                ? { ...storedState }
                : defaultEnforcerState();
              const hasWrongBase = failures.some(
                failure => failure.code === "wrong_base"
              );
              const willPrefixTitle =
                hasWrongBase && !pr.title.startsWith(TITLE_PREFIX);
              const shouldStripTitlePrefix =
                !hasWrongBase &&
                state.titlePrefixedByBot &&
                pr.title.startsWith(TITLE_PREFIX);

              // Claim title ownership before adding a prefix. Do not clear
              // ownership until strip succeeds — a failed update must retry.
              if (willPrefixTitle) {
                state.titlePrefixedByBot = true;
              }

              // A stale bot-owned prefix comes off once, whichever path owns
              // the draft: the branch is fixed even when the checklist is not.
              if (shouldStripTitlePrefix) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number,
                  title: pr.title.slice(TITLE_PREFIX.length)
                });
                state.titlePrefixedByBot = false;
              }

              if (checklistRequired && !pr.draft && !checklistComplete) {
                // Claim draft ownership before the mutation so a successful
                // convert followed by a failed comment still restores later
                // (same checkpoint discipline as the quality-failure path).
                readinessState.autoDraftedByBot = true;
                await upsertReadinessComment(
                  readinessState,
                  readiness,
                  [
                    ...revalidationNotice,
                    "This PR stays in draft until every box above is ticked."
                  ]
                );
              }

              if (failures.length > 0) {
                state.ancestryFailed = failures.some(
                  failure => failure.code === "wrong_ancestry"
                );
                state.descriptionFailed = failures.some(
                  failure => failure.code === "bad_description"
                );
                state.screenshotFailed = failures.some(
                  failure => failure.code === "missing_ui_screenshot"
                );
  
                let draftConversionFailed = false;
                const failureSections = buildFailureSections(failures, {
                  pr,
                  allowedBases: ALLOWED_BASES,
                  defaultBase: DEFAULT_BASE
                });
  
                if (checklistRequired && !checklistComplete) {
                  failureSections.push(
                    "",
                    "⏳ **Review readiness checklist**",
                    "",
                    `This pull request stays in draft until all four boxes of the readiness checklist in the description are ticked (currently ${readiness.checked}/${readiness.total}).`,
                    "",
                    `@${pr.user.login} Tick the boxes once your local CI is green, your branch is on the latest ${inlineCode(DEFAULT_BASE)} commit, and every correct Codex and CodeRabbit finding is fixed.`
                  );
                }
  
                await upsertComment(
                  [
                    COMMENT_MARKER,
                    stateMarker(state),
                    "",
                    ...failureSections,
                    "",
                    "Recording ownership state before applying title/draft changes…"
                  ].join("\n")
                );
  
                if (willPrefixTitle) {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number,
                    title: `${TITLE_PREFIX}${pr.title}`
                  });
                }
  
                if (!pr.draft) {
                  // Claim draft ownership before the mutation so a successful
                  // convert followed by a failed comment still restores later.
                  state.autoDraftedByBot = true;
                  await upsertComment(
                    [
                      COMMENT_MARKER,
                      stateMarker(state),
                      "",
                      ...failureSections,
                      "",
                      "Draft conversion pending…"
                    ].join("\n")
                  );
                  try {
                    await convertToDraft();
                    draftConverted = true;
                    readinessState.autoDraftedByBot = true;
                    await upsertComment(
                      [
                        COMMENT_MARKER,
                        stateMarker(state),
                        "",
                        ...failureSections,
                        "",
                        "Draft conversion succeeded; finalising explanation…"
                      ].join("\n")
                    );
                  } catch (error) {
                    draftConversionFailed = true;
                    state.autoDraftedByBot = false;
                    core.warning(
                      `Could not convert pull request to draft: ${error.message}`
                    );
                  }
                }
  
                const draftExplanation = draftConversionFailed
                  ? "Automatic draft conversion failed (token cannot change draft status). Please convert this pull request to a draft manually. The required `enforce-target` check will keep failing until every issue above is resolved."
                  : state.autoDraftedByBot
                    ? "This pull request is being kept as a draft automatically. Once every issue above is resolved, it will be marked ready for review again."
                    : "This pull request was already a draft. Its draft status will be preserved after every issue above is resolved.";
  
                const finalSections = [...failureSections];
  
                if (hasWrongBase && state.titlePrefixedByBot) {
                  finalSections.push(
                    "",
                    `Its title has been prefixed with ${inlineCode(TITLE_PREFIX.trim())}.`
                  );
                }
  
                await upsertComment(
                  [
                    COMMENT_MARKER,
                    stateMarker(state),
                    "",
                    ...finalSections,
                    "",
                    draftExplanation
                  ].join("\n")
                );
  
                if (checklistRequired) {
                  await upsertReadinessComment(
                    readinessState,
                    readiness,
                    [
                      ...revalidationNotice,
                      checklistComplete
                        ? "✅ **All four boxes are ticked.** This PR still stays in draft until the issues above are resolved."
                        : pr.draft || draftConverted
                          ? "This PR stays in draft until every box above is ticked."
                          : "Automatic draft conversion failed. Please convert this pull request to a draft manually until every box above is ticked."
                    ]
                  );
                }
  
                core.setFailed(
                  `PR quality gate failed: ${failureSummary(failures, { pr })}`
                );
                return;
              }

              // No quality failure; the draft is owed by the open checklist.
              // Prior enforcer history (title prefix, earlier failures) gets a
              // closing confirmation; the readiness comment owns the draft now.
              if (storedState?.active || botComment) {
                const prefixResult = shouldStripTitlePrefix
                  ? `The ${inlineCode(TITLE_PREFIX.trim())} title prefix has been removed.`
                  : "The title was left unchanged.";
                await upsertComment(
                  [
                    COMMENT_MARKER,
                    stateMarker(clearedEnforcerState()),
                    "",
                    "✅ **PR quality gates passed**",
                    "",
                    `This pull request now targets ${inlineCode(pr.base.ref)} with acceptable ancestry, description, and UI screenshot coverage. It stays in draft until the review readiness checklist is complete.`,
                    "",
                    `${prefixResult} The draft is owned by the checklist message below.`
                  ].join("\n")
                );
              }

              if (!pr.draft && !draftConverted) {
                try {
                  await convertToDraft();
                  draftConverted = true;
                } catch (error) {
                  readinessState.autoDraftedByBot = false;
                  core.warning(
                    `Could not convert pull request to draft: ${error.message}`
                  );
                  core.setFailed(
                    "PR quality gate failed: could not convert the pull request to draft while the review readiness checklist is open."
                  );
                }
              }

              await upsertReadinessComment(
                readinessState,
                readiness,
                [
                  ...revalidationNotice,
                  pr.draft || draftConverted
                    ? "This PR stays in draft until every box above is ticked."
                    : "Automatic draft conversion failed. Please convert this pull request to a draft manually until every box above is ticked."
                ]
              );
              return;
            }

            if (!storedState?.active && !checklistRequired) {
              // A maintainer PR drafted while the permission lookup was failing
              // (fail-closed) gets restored once the lookup recovers.
              if (storedReadinessState?.autoDraftedByBot && pr.draft) {
                let recoveryFailed = false;
                try {
                  await markReadyForReview();
                } catch (error) {
                  recoveryFailed = true;
                  core.warning(
                    `Could not mark pull request ready for review: ${error.message}`
                  );
                }
                await upsertReadinessComment(
                  recoveryFailed
                    ? { ...storedReadinessState }
                    : { ...storedReadinessState, autoDraftedByBot: false },
                  readiness,
                  [
                    recoveryFailed
                      ? "Automatic ready-for-review conversion failed; the PR stays a draft and will be retried on the next run."
                      : "✅ This PR is ready for review."
                  ]
                );
              }
              core.info(
                "All PR quality gates passed and there is no active bot state."
              );

              return;
            }

            if (
              storedState?.titlePrefixedByBot &&
              pr.title.startsWith(TITLE_PREFIX)
            ) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                title: pr.title.slice(TITLE_PREFIX.length)
              });
            }

            let readyConversionFailed = false;
            let readyConverted = false;
            const shouldMarkReady =
              (storedState?.active && storedState.autoDraftedByBot) ||
              (checklistRequired && checklistComplete);
            if (shouldMarkReady && pr.draft) {
              try {
                await markReadyForReview();
                readyConverted = true;
              } catch (error) {
                readyConversionFailed = true;
                core.warning(
                  `Could not mark pull request ready for review: ${error.message}`
                );
              }
            }

            // The enforcer comment only exists when there was something to say;
            // a clean contributor PR that never failed a quality gate has none.
            if (storedState?.active || botComment) {
              const completedState = readyConversionFailed
                ? { ...clearedEnforcerState(), active: true, autoDraftedByBot: true }
                : clearedEnforcerState();

              const titleResult = storedState?.titlePrefixedByBot
                ? `The ${inlineCode(TITLE_PREFIX.trim())} title prefix has been removed.`
                : "The title was left unchanged.";

              const draftResult = readyConversionFailed
                ? "Automatic ready-for-review conversion failed; please mark the pull request ready manually if it is still a draft."
                : storedState?.autoDraftedByBot
                  ? "The pull request has been marked ready for review again."
                  : "Its existing draft status has been preserved.";

              await upsertComment(
                [
                  COMMENT_MARKER,
                  stateMarker(completedState),
                  "",
                  "✅ **PR quality gates passed**",
                  "",
                  `This pull request now targets ${inlineCode(pr.base.ref)} with acceptable ancestry, description, and UI screenshot coverage.${
                    checklistRequired
                      ? " The review readiness checklist is complete."
                      : ""
                  }`,
                  "",
                  `${titleResult} ${draftResult}`
                ].join("\n")
              );
            }

            // Checklist completion lifts the contributor draft and pings the
            // maintainers from `MAINTAINERS.md` (minus the PR author).
            if (checklistRequired && checklistComplete) {
              const readinessState = storedReadinessState
                ? { ...storedReadinessState }
                : defaultReadinessState();
              const maintainers = readMaintainerLogins().filter(
                login => login !== pr.user.login
              );
              let notified = false;
              if (!readinessState.maintainersPinged && maintainers.length > 0) {
                readinessState.maintainersPinged = true;
                notified = true;
              }

              // Bind the completion to the exact head it attested. A later
              // `synchronize` event with a different head resets the checklist
              // and the notification state (see `headDrifted` above).
              readinessState.completedAtHeadSha = pr.head.sha;
              readinessState.version = READINESS_STATE_VERSION;

              await upsertReadinessComment(
                readinessState,
                readiness,
                [
                  "✅ **All four boxes are ticked.**",
                  `Completed against head ${inlineCode(pr.head.sha.slice(0, 7))}; new commits after this will reset the checklist.`,
                  readyConverted
                    ? "This pull request has been marked Ready for Review."
                    : pr.draft
                      ? "Automatic ready-for-review conversion failed; please mark the pull request ready manually."
                      : "This pull request is already Ready for Review.",
                  notified && maintainers.length > 0
                    ? `Maintainers notified: ${maintainers
                        .map(login => `@${login}`)
                        .join(" ")}`
                    : maintainers.length > 0
                      ? `Maintainers: ${maintainers
                          .map(login => `@${login}`)
                          .join(" ")}`
                      : "Maintainers will be notified."
                ]
              );
            }
